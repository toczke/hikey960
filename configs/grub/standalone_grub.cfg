search --no-floppy --fs-uuid --set=root ebba5088-7c86-426d-8cd2-9899c9d50b36
if [ -z "$root" ]; then
    search --no-floppy --label --set=root rootfs
fi

# Guard against infinite recursion: only chainload if root is a real disk partition
if [ "$root" != "memdisk" ] && [ -f ($root)/boot/grub/grub.cfg ]; then
    set prefix=($root)/boot/grub
    configfile ($root)/boot/grub/grub.cfg
fi

# Fallback boot menu if rootfs grub.cfg cannot be loaded
set default=0
set timeout=5

menuentry "Armbian GNU/Linux (Kirin 960 VPU Kernel)" {
    linux ($root)/boot/vmlinuz-7.1.13-venc root=UUID=ebba5088-7c86-426d-8cd2-9899c9d50b36 rootwait rw console=ttyAMA6,115200 console=tty0 cma=256M
    initrd ($root)/boot/initrd.img-7.1.13-hikey960
    devicetree ($root)/boot/armbian-dtb-7.1.13-venc
}

menuentry "Armbian GNU/Linux (Previous Working VDEC Kernel)" {
    linux ($root)/boot/vmlinuz-7.1.13-hikey960.bak-vdec root=UUID=ebba5088-7c86-426d-8cd2-9899c9d50b36 rootwait rw console=ttyAMA6,115200 console=tty0 cma=256M
    initrd ($root)/boot/initrd.img-7.1.13-hikey960
    devicetree ($root)/boot/armbian-dtb-7.1.13-hikey960.bak-vdec
}
