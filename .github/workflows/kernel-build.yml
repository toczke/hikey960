name: ARM64 Kernel and DTB Build

on:
  push:
    branches: [ main, master, feature/kirin960-vpu-1080p ]
  pull_request:
    branches: [ main, master, feature/kirin960-vpu-1080p ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Toolchain and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev make device-tree-compiler ccache curl tar xz-utils

    - name: Setup ccache Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: hikey960-kernel-ccache-${{ runner.os }}-${{ hashFiles('configs/hikey960-defconfig') }}
        restore-keys: |
          hikey960-kernel-ccache-${{ runner.os }}-

    - name: Configure ccache
      run: |
        ccache --max-size=5G
        ccache -z

    - name: Fetch Linux Kernel Source
      run: |
        echo "Downloading official Linux 7.1.13 from cdn.kernel.org..."
        curl -fSL https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.13.tar.xz -o linux-7.1.13.tar.xz
        mkdir -p linux-src
        tar -xf linux-7.1.13.tar.xz -C linux-src --strip-components=1
        rm linux-7.1.13.tar.xz
        echo "Kernel source ready in linux-src"

    - name: Apply Custom Patches
      working-directory: ./linux-src
      run: |
        if [ -d "../patches" ]; then
          for p in ../patches/*.patch; do
            echo "Applying $p"
            patch -p1 < "$p"
          done
        fi

    - name: Inject Kirin 960 DRM Driver
      working-directory: ./linux-src
      run: |
        cp -r ../drivers-import/kirin960 drivers/gpu/drm/hisilicon/
        echo "source \"drivers/gpu/drm/hisilicon/kirin960/Kconfig\"" >> drivers/gpu/drm/hisilicon/Kconfig
        echo "obj-y += kirin960/" >> drivers/gpu/drm/hisilicon/Makefile

    - name: Inject Kirin 960 VPU Driver
      working-directory: ./linux-src
      run: |
        cp -r ../drivers-import/vcodec drivers/
        sed -i '/endmenu/i source "drivers/vcodec/Kconfig"' drivers/Kconfig
        echo "obj-y += vcodec/" >> drivers/Makefile

    - name: Configure Kernel
      working-directory: ./linux-src
      run: |
        # Use full HiKey960 config from working Armbian 7.1.10 kernel
        cp ../configs/hikey960-defconfig .config
        make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" olddefconfig
        
        # Fix BT DMA and baud rate bugs directly in DTB by deleting 'dmas' and 'max-speed'
        sed -i '/&uart4 {/a \\t/delete-property/ dmas;' arch/arm64/boot/dts/hisilicon/hi3660-hikey960.dts
        sed -i '/max-speed = <3000000>;/d' arch/arm64/boot/dts/hisilicon/hi3660-hikey960.dts
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git commit -am "Apply HiKey960 DTB fixes" || true

    - name: Build Kernel (Image.gz)
      working-directory: ./linux-src
      run: |
        make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j$(nproc) Image.gz

    - name: Build Device Tree Blobs (DTB)
      working-directory: ./linux-src
      run: |
        make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j$(nproc) dtbs

    - name: Show ccache Statistics
      run: |
        ccache -s

    - name: Extract Kernel Version
      id: kver
      working-directory: ./linux-src
      run: |
        KVER=$(make -s ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" kernelrelease)
        echo "KERNEL_VERSION=$KVER" >> $GITHUB_ENV
        echo "Built kernel version: $KVER"

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hikey960-kernel-artifacts-${{ env.KERNEL_VERSION }}
        path: |
          linux-src/arch/arm64/boot/Image.gz
          linux-src/arch/arm64/boot/dts/hisilicon/*.dtb
        retention-days: 7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.KERNEL_VERSION }}
        name: Kernel ${{ env.KERNEL_VERSION }} (Testing / Pre-release)
        prerelease: true
        body: |
          Automated test build for HiKey960.
          - Kernel version: ${{ env.KERNEL_VERSION }}
          - Status: Testing / Experimental Pre-release
          - Includes DTB and DRM/GPU fixes
        files: |
          linux-src/arch/arm64/boot/Image.gz
          linux-src/arch/arm64/boot/dts/hisilicon/hi3660-hikey960.dtb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
