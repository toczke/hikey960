name: ARM64 Kernel and DTB Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Toolchain and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev make device-tree-compiler

    - name: Fetch Linux Kernel Source
      run: |
        git clone --depth 1 -b linux-7.1.y https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux-src

    - name: Apply Custom Patches
      working-directory: ./linux-src
      run: |
        if [ -d "../patches" ]; then
          for p in ../patches/*.patch; do
            echo "Applying $p"
            patch -p1 < "$p"
          done
        fi

    - name: Configure Kernel
      working-directory: ./linux-src
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
        
        # Apply critical config overrides for HiKey960 (Storage, PMIC, USB, GPU)
        ./scripts/config --enable CONFIG_SCSI_UFSHCD
        ./scripts/config --enable CONFIG_SCSI_UFSHCD_PLATFORM
        ./scripts/config --enable CONFIG_SCSI_UFS_HISI
        ./scripts/config --enable CONFIG_EXT4_FS
        ./scripts/config --enable CONFIG_COMMON_CLK_HI3660
        ./scripts/config --enable CONFIG_RESET_CONTROLLER
        ./scripts/config --enable CONFIG_MFD_HI6421_PMIC
        ./scripts/config --enable CONFIG_REGULATOR
        ./scripts/config --enable CONFIG_REGULATOR_HI6421V530
        ./scripts/config --enable CONFIG_REGULATOR_FIXED_VOLTAGE
        ./scripts/config --enable CONFIG_USB_ROLE_SWITCH
        ./scripts/config --enable CONFIG_TYPEC
        ./scripts/config --disable CONFIG_USB_DWC3_HOST
        ./scripts/config --disable CONFIG_USB_DWC3_GADGET
        ./scripts/config --enable CONFIG_DRM_PANFROST
        ./scripts/config --enable CONFIG_DRM_HISI_KIRIN
        ./scripts/config --enable CONFIG_DRM_HISI_KIRIN960
        ./scripts/config --enable CONFIG_DRM_I2C_ADV7511
        ./scripts/config --enable CONFIG_DRM_I2C_ADV7511_AUDIO
        ./scripts/config --enable CONFIG_BLK_DEV_NVME
        
        # Fix BT DMA and baud rate bugs directly in DTB by deleting 'dmas' and 'max-speed'
        sed -i '/&uart4 {/a \\t/delete-property/ dmas;' arch/arm64/boot/dts/hisilicon/hi3660-hikey960.dts
        sed -i '/max-speed = <3000000>;/d' arch/arm64/boot/dts/hisilicon/hi3660-hikey960.dts
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git commit -am "Apply HiKey960 DTB fixes" || true

    - name: Build Kernel (Image.gz)
      working-directory: ./linux-src
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz

    - name: Build Device Tree Blobs (DTB)
      working-directory: ./linux-src
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) dtbs

    - name: Extract Kernel Version
      id: kver
      working-directory: ./linux-src
      run: |
        KVER=$(make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)
        echo "KERNEL_VERSION=$KVER" >> $GITHUB_ENV
        echo "Built kernel version: $KVER"

    - name: Generate boot.img (for stock EDK2)
      working-directory: ./linux-src
      run: |
        sudo apt-get install -y mkbootimg
        # Create a dummy ramdisk
        echo "dummy" > dummy.txt && gzip -c dummy.txt > ramdisk.img
        # Assemble Android-style boot.img with HiKey960 offsets
        mkbootimg --kernel arch/arm64/boot/Image.gz \
                  --ramdisk ramdisk.img \
                  --cmdline "console=ttyAMA6,115200 root=/dev/mmcblk0p1 rw rootwait earlycon=pl011,0xfdf05000" \
                  --base 0x0 \
                  --tags-addr 0x07A00000 \
                  --kernel_offset 0x00080000 \
                  --ramdisk_offset 0x07c00000 \
                  --output hikey960-boot.img

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hikey960-kernel-artifacts-${{ env.KERNEL_VERSION }}
        path: |
          linux-src/arch/arm64/boot/Image.gz
          linux-src/arch/arm64/boot/dts/hisilicon/*.dtb
          linux-src/hikey960-boot.img
        retention-days: 7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.KERNEL_VERSION }}
        name: Kernel ${{ env.KERNEL_VERSION }}
        body: |
          Automated kernel build for HiKey960.
          - Kernel version: ${{ env.KERNEL_VERSION }}
          - Includes DTB fixes for Panfrost GPU and Bluetooth
        files: |
          linux-src/arch/arm64/boot/Image.gz
          linux-src/arch/arm64/boot/dts/hisilicon/hi3660-hikey960.dtb
          linux-src/hikey960-boot.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
