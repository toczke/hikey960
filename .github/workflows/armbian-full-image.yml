name: Full Armbian OS Build

on:
  workflow_dispatch: 

jobs:
  build-armbian:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free Disk Space for Docker
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Checkout Our Repository
      uses: actions/checkout@v4
      with:
        path: hikey-repo

    - name: Checkout Armbian Build Framework
      run: |
        git clone --depth 1 https://github.com/armbian/build armbian-build

    - name: Run Our Flawless Build Patch (01-build-armbian.sh)
      run: |
        cd armbian-build
        cp ../hikey-repo/scripts/01-build-armbian.sh ./
        chmod +x 01-build-armbian.sh
        # Wywołujemy nasz skrypt, aby przygotować customową konfigurację
        ./01-build-armbian.sh

    - name: Set up QEMU for Cross-Compilation
      uses: docker/setup-qemu-action@v3

    - name: Compile Armbian Image (HiKey960)
      run: |
        cd armbian-build
        sudo ./compile.sh build BOARD=hikey960 BRANCH=edge BUILD_DESKTOP=no BUILD_MINIMAL=yes KERNEL_CONFIGURE=no RELEASE=trixie

    - name: Upload Armbian Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hikey960-armbian-image
        path: armbian-build/output/images/*.img*
        retention-days: 7
